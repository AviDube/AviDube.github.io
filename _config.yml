# Site settings
title: Avi Dube
title_separator: "-"
subtitle: Drone Researcher @ AirLab · M.S. ECE @ Carnegie Mellon University
logo: "assets/images/logo.PNG"
email: dubea@purdue.edu
description: >-
  Portfolio of Amikosh (Avi) Dube — Drone Researcher at CMU AirLab, Founding
  Technical Lead of Codex Laboratories (SWARM), and M.S. Computer Engineering
  student at Carnegie Mellon University. Specializing in physical AI, autonomous
  systems, and robotics.
github_username: AviDube

# Build settings
markdown: kramdown

# Collections
collections:
  portfolio:
    output: true
    permalink: /:collection/:path/
  learn:
    output: true
    permalink: /:collection/:path/
  hobbies:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page

  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      show_date: true

  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single

permalink: /:categories/:title/
paginate: 5
paginate_path: /_pages/page:num/

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

author:
  name   : "Avi Dube"
  avatar : "/assets/images/pfp3.jpg"
  bio    : "Drone Researcher @ CMU AirLab. Founding Technical Lead @ Codex Labs. Incoming Aurora intern. M.S. ECE @ Carnegie Mellon."
  links:
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/amikoshdube/"
    - label: "GitHub"
      url: "https://github.com/AviDube"
    - label: "YouTube"
      url: "https://www.youtube.com/c/Eagles1961Z"

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
